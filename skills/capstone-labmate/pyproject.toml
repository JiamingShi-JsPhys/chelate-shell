[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-labmate"
version = "1.0.0-beta"
description = "An Agent-Native interoperability tool for PASCO Capstone: pre-lab .cap pre-configuration (with QA checklists) + post-lab local downsampling/CSV export + data-faithful draft report generation."
authors = [
    { name = "Jiaming Shi", email = "jiamingshi_git@outlook.com" }
]
license = "MIT"
requires-python = ">=3.9"
readme = "README.md"
keywords = ["pasco", "capstone", "labmate", "education", "interoperability", "skill", "agent-native", "academic-integrity"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Education",
]

dependencies = [
    "numpy>=1.20",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.urls]
Homepage = "https://github.com/JiamingShi-JsPhys/capstone-labmate"
Repository = "https://github.com/JiamingShi-JsPhys/capstone-labmate.git"
Issues = "https://github.com/JiamingShi-JsPhys/capstone-labmate/issues"

# NOTE: This is a directory-style Agent Skill (SKILL.md + scripts/), not a
# Python distribution. There is deliberately no console-script entry point
# and no importable package; hosts invoke scripts/ directly. The metadata
# above exists for discoverability (PyPI-style keywords/classifiers).

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

# Optional: Add Ruff for modern code formatting and linting (shows high engineering standards)
[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"] # pycodestyle errors, Pyflakes, isort
