[project]
name = "conflict-detector"
version = "1.0.0"
description = "Cross-document conflict detector (entity / clause / argument level contradictions)."
authors = [{ name = "Jiaming Shi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
cd = "src.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
