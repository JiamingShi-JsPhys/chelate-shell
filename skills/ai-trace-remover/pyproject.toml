[project]
name = "ai-trace-remover"
version = "1.2.0"
description = "De-AI-flavour detection and rewriting for Chinese and English prose. Pure standard library."
authors = [{ name = "Jiaming Shi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
# Deliberately no runtime dependencies: the engine runs on the standard
# library alone. The only dev-time dependency is pytest, for the test suite.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-trace-remover = "src.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
