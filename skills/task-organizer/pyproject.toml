[project]
name = "task-organizer"
version = "1.2.0"
description = "Reorganizes a messy task folder into a standardized three-tier structure (material / process / results, plus _broadcast/ index) with snapshots, verification, and rollback."
authors = [{ name = "Jiaming Shi" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
to = "scripts.run:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
