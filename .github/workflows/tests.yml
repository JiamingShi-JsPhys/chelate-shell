name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The path a fresh user gets: `pip install` of the plugin installs nothing
  # else, so the suite must survive on pytest alone. Tests that assert a real
  # verdict from an optional dependency (sympy, pint, pandas, pypdf, …) skip
  # here via tests/conftest.py:requires(); the degradation-to-UNVERIFIED path
  # they leave behind is still exercised.
  bare:
    name: pytest (${{ matrix.python-version }}, bare)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only
        run: python -m pip install --upgrade pip pytest
      - name: Run the suite
        run: python -m pytest -q

  # Same suite with the optional dependencies installed, so the PASS paths
  # the bare job skips are actually executed. Keep this list in step with
  # the `dependencies` arrays in skills/*/manifest.json.
  extras:
    name: pytest (${{ matrix.python-version }}, extras)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scikit-learn matplotlib \
            seaborn sympy pint pypdf pdfminer.six bibtexparser requests arxiv
      - name: Run the suite
        run: python -m pytest -q
